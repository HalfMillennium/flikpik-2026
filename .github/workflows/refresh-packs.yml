name: Refresh list packs

# Portable fallback scheduler (use this if you're not on Vercel Cron).
# Set repo secrets: SITE_URL (e.g. https://flikpik.app) and CRON_SECRET.
on:
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the refresh endpoint
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/refresh-packs"
